<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-label="待辦清單">
        <header class="todo-header">
          <h1>待辦清單</h1>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <input
            id="todo-input"
            type="text"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
          />
          <button id="add-btn" type="submit">新增</button>
        </form>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <p id="empty-state" class="empty-state" hidden>
          還沒有任何待辦事項,新增一個吧!
        </p>

        <footer class="todo-footer">
          <div class="todo-footer-main">
            <span id="todo-count">未完成: 0 項</span>
            <button
              id="clear-completed-btn"
              class="clear-completed-btn"
              type="button"
              aria-label="清除所有已完成項目"
            >
              清除已完成
            </button>
          </div>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
